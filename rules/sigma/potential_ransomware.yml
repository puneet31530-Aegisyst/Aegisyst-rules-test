title: Potential Ransomware Activity - Data Encrypted for Impact (T1486)
id: 8d0c1d4b-5f2b-4d6f-9a87-4e7b8a0e0ed1
status: stable
description: Detects common ransomware-style encryption behavior by identifying suspicious command-line usage of well-known encryption tools and deletion of backups/shadow copies.
references:
  - https://attack.mitre.org/techniques/T1486/
author: Detection Engineering
date: 2026-07-16
tags:
  - attack.impact
  - attack.t1486
logsource:
  product: windows
  category: process_creation
detection:
  selection_vssadmin_delete_shadows:
    Image|endswith: '\\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  selection_wmic_shadowcopy_delete:
    Image|endswith: '\\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  selection_powershell_shadowcopy: 
    Image|endswith: 
      - '\\powershell.exe' 
      - '\\pwsh.exe' 
      CommandLine|contains: 
        - 'Win32_ShadowCopy' 
        - 'Delete()' 
        - 'Remove-WmiObject' 
        - '-EncodedCommand' 
        - 'FromBase64String' 
        filter_legit_backups: 
      CommandLine|contains: 
            - 'backup-tool-exe' 
            - 'veeam' 
  condition: selection_vssadmin_delete_shadows or selection_wmic_shadowcopy_delete or selection_bcdedit_recovery_disabled or (selection_powershell_shadowcopy AND NOT filter_legit_backups) 
  selection_bcdedit_recovery_disabled:
    Image|endswith: '\\bcdedit.exe'
    CommandLine|contains|all:
      - '/set'
      - '{default}'
    CommandLine|contains:
      - 'recoveryenabled'
      - 'bootstatuspolicy'
  selection_wbadmin_delete_catalog:
    Image|endswith: '\\wbadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'catalog'
  selection_cipher_wipe_free_space:
    Image|endswith: '\\cipher.exe'
    CommandLine|contains: ' /w:'
  selection_mcb_delete_backups:
    Image|endswith: '\\manage-bde.exe'
    CommandLine|contains:
      - '-off'
      - '-unlock'
  selection_openssl_encrypt:
    Image|endswith: '\\openssl.exe'
    CommandLine|contains:
      - ' enc '
      - ' -aes'
      - ' -rsa'
  selection_7zip_password_encrypt:
    Image|endswith:
      - '\\7z.exe'
      - '\\7za.exe'
      - '\\7zr.exe'
    CommandLine|contains:
      - ' a '
      - ' -p'
      - ' -mhe='
  selection_gpg_encrypt:
    Image|endswith:
      - '\\gpg.exe'
      - '\\gpg2.exe'
    CommandLine|contains:
      - ' --encrypt'
      - ' -e'
  condition: 1 of selection_*
falsepositives:
  - Legitimate backup administration (shadow copy maintenance, recovery configuration)
  - Disk maintenance (cipher /w)
  - Legitimate use of encryption utilities (openssl/gpg/7zip with passwords) by administrators or automation
level: high
fields:
  - Image
  - CommandLine
  - ParentImage
  - User
  - Computer
  - ProcessId
  - ParentProcessId
  - OriginalFileName
  - Hashes
  - LogonId
  - IntegrityLevel
  - Signed
  - SignatureStatus
  - Product
  - Company
  - Description
  - CurrentDirectory
  - EventID
  - Channel
  - ProviderName
notes: |
  Requires process creation auditing. Windows Security Event ID 4688 (Process Creation) and/or Sysmon Event ID 1 are recommended.
  Tuning ideas: restrict to non-admin users, unusual parent processes, execution from user-writeable paths, or bursts across many hosts.
  Consider correlating with file rename patterns, high-volume file modifications, and backup service tampering for higher fidelity.
