title: Python Interpreter Execution (T1059.006)
id: 3d0cbb5b-2b38-4f2b-9f56-2f3b6f2fdc3f
status: stable
description: Detects execution of the Python interpreter, including common invocation patterns that may indicate script-based execution (MITRE ATT&CK T1059.006). Tuned for general enterprise environments with common allowlist exclusions for benign paths.
author: OpenAI
date: 2026-08-10
references:
  - https://attack.mitre.org/techniques/T1059/006/
tags:
  - attack.execution
  - attack.t1059.006
logsource:
  category: process_creation
  product: windows
detection:
  sel_image:
    Image|endswith:
      - '\\python.exe'
      - '\\pythonw.exe'
  sel_cmd:
    CommandLine|contains:
      - ' python '
      - ' python.exe'
      - ' pythonw.exe'
      - ' -c '
      - ' -m '
      - ' -i'
      - ' pip '
      - 'pip3'
  selection:
    condition: sel_image or sel_cmd
  filter_common_install_paths:
    Image|startswith:
      - 'C:\\Windows\\py.exe'
      - 'C:\\Users\\'
      - 'C:\\Program Files\\Python'
      - 'C:\\Program Files (x86)\\Python'
      - 'C:\\ProgramData\\Anaconda3\\'
      - 'C:\\Users\\Public\\Anaconda3\\'
  filter_microsoft_store_python:
    Image|contains:
      - '\\WindowsApps\\PythonSoftwareFoundation.Python'
  filter_dev_tools:
    ParentImage|endswith:
      - '\\code.exe'
      - '\\devenv.exe'
      - '\\pycharm64.exe'
      - '\\idea64.exe'
      - '\\eclipse.exe'
      - '\\atom.exe'
      - '\\sublime_text.exe'
      - '\\cmd.exe'
      - '\\powershell.exe'
  condition: (_image or _cmd) and not (filter_microsoft_store_python or filter_dev_tools or filter_common_install_paths)
fields:
  - ComputerName
  - User
  - Image
  - CommandLine
  - ParentImage
  - ParentCommandLine
  - ProcessId
falsepositives:
  - Legitimate Python usage by developers, data science users, automation tooling, and enterprise software packaging.
  - Python execution by IT automation (e.g., configuration management agents) depending on environment.
level: medium
