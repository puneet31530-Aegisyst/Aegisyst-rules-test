title: Built-in Utility Abuse Potentially Associated with Mass Encryption (cipher/compact/7z) (T1486)
id: 6b8a2c1a-4f22-4c19-9b8e-9cdb5c2d1f61
status: experimental
description: |
  Detects suspicious use of built-in encryption/compression utilities often seen in ransomware operations,
  including cipher.exe wiping free space, compact.exe mass compression, or 7z.exe being used for bulk processing.
author: ChatGPT
date: 2026-08-11
references:
  - https://attack.mitre.org/techniques/T1486/
tags:
  - attack.impact
  - attack.t1486
logsource:
  product: windows
  category: process_creation
  definition: 'Sysmon EventID 1 and/or Windows Security EventID 4688'
detection:
  selection_cipher_wipe:
    Image|endswith:
      - '\\cipher.exe'
    CommandLine|contains:
      - ' /w:'
  selection_compact_mass:
    Image|endswith:
      - '\\compact.exe'
    CommandLine|contains|all:
      - ' /c'
  selection_7z_bulk:
    Image|endswith:
      - '\\7z.exe'
      - '\\7za.exe'
      - '\\7zr.exe'
    CommandLine|contains:
      - ' a '
      - ' -p'
      - ' -mhe'
      - ' -r'
falsepositives:
  - Administrative maintenance using cipher /w
  - Legitimate bulk compression/archiving activities
level: medium
condition: 1 of selection_*