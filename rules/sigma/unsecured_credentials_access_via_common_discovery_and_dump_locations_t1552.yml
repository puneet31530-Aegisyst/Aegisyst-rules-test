title: Unsecured Credentials Access Via Common Discovery and Dump Locations (T1552)
id: 6ef7d2ef-197d-4f1c-8b33-50b3f8c7b0a9
status: experimental
description: Detects processes attempting to read common unsecured credential sources such as files containing passwords, Windows credential stores, and unattended installation artifacts. Maps to MITRE ATT&CK T1552 Unsecured Credentials.
author: ChatGPT (Detection Engineering)
date: 2026-08-16
references:
  - https://attack.mitre.org/techniques/T1552/
logsource:
  category: process_creation
  product: windows
detection_logic_description: |
  Detects process events where utilities access known unsecured credential locations, patterns, or invoke credential-related commands (e.g., '.rdp', '.kdbx', credential stores). Ignores noise from OS-initiated processes and standard update activities, utilizing specific exclusions. To optimize, incorporate exclusions for authorized admin tools and adjust for sensitive extensions relevant to the organization.
detection:
  selection_sensitive_paths_cmd:
    CommandLine|contains:
      - '\Windows\Panther\Unattend.xml'
      - '\Windows\Panther\Unattend\Unattend.xml'
      - '\Windows\Panther\Unattend\'
      - '\Windows\System32\Sysprep\sysprep.xml'
      - '\Windows\System32\Sysprep\unattend.xml'
      - '\ProgramData\Microsoft\Group Policy\History\'
      - '\Groups.xml'
      - '\Services.xml'
      - '\Scheduledtasks.xml'
      - '\Printers.xml'
      - '\Drives.xml'
      - '\DataSources.xml'
      - '\Preferences\'
      - '\AppData\Roaming\Microsoft\Credentials\'
      - '\AppData\Local\Microsoft\Credentials\'
      - '\Microsoft\Protect\'
      - '\Windows\System32\config\SAM'
      - '\Windows\System32\config\SECURITY'
      - '\Windows\System32\config\SYSTEM'
      - '\Windows\NTDS\NTDS.dit'
      - '\Windows\System32\winevt\Logs\Security.evtx'
      - '\.aws\credentials'
      - '\.azure\'
      - '\.docker\config.json'
      - '\.kube\config'
      - '\.git-credentials'
      - '\id_rsa'
      - '\known_hosts'
      - 'passwords.txt'
      - 'pass.txt'
      - 'creds.txt'
      - 'credentials.txt'
      - 'secrets.txt'
  selection_sensitive_ext_cmd:
    CommandLine|contains:
      - '.kdbx'
      - '.rdp'
      - '.vnc'
      - '.ovpn'
      - '.pfx'
      - '.p12'
      - '.pem'
      - '.ppk'
      - '.key'
      - '.pgpass'
      - '.netrc'
  selection_cred_cli:
    Image|endswith:
      - '\cmdkey.exe'
      - '\vaultcmd.exe'
      - '\reg.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wsl.exe'
      - '\bash.exe'
    CommandLine|contains:
      - ' /list'
      - ' /enumerate'
      - ' vault'
      - ' list'
      - ' HKLM\\SECURITY'
      - ' HKLM\\SAM'
      - ' HKLM\\SYSTEM'
      - 'Get-ChildItem '
      - 'Get-Content '
      - 'Select-String '
      - 'findstr '
      - 'type '
  filter_common_os_parent:
    ParentImage|endswith:
      - '\services.exe'
      - '\svchost.exe'
      - '\taskhostw.exe'
      - '\wininit.exe'
      - '\wuauclt.exe'
  filter_common_os_cmdline:
    CommandLine|contains:
      - 'MpCmdRun.exe'
      - 'SoftwareDistribution\Download'
      - 'Microsoft\Windows\WindowsUpdate'
      - 'MsSense.exe'
      - '\WmiPrvSE.exe'
  condition: (1 of selection_*) AND NOT (1 of filter_*)
falsepositives:
  - Administrators or helpdesk staff retrieving stored credentials or troubleshooting.
  - Legitimate password managers accessing .kdbx or certificate management workflows handling .pfx/.pem.
  - Backup/EDR/IR tooling reading system hives or policy preference files.
level: high
tags:
  - attack.credential_access
  - attack.t1552